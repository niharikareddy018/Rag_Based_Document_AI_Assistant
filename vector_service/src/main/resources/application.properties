# ===================================================================
# Spring Boot Vector Service Configuration
# ===================================================================

# Server Port
server.port=8080

# Spring Application
spring.application.name=vector_service

# PostgreSQL Database with pgvector Extension
spring.datasource.url=jdbc:postgresql://localhost:5432/vectordb
spring.datasource.username=postgres
spring.datasource.password=your_secure_password
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# RabbitMQ Message Broker Configuration
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# Queue, Exchange & Routing Definitions
rabbitmq.queue.chunking=document.chunking.queue
rabbitmq.queue.embedding=vector.embedding.queue
rabbitmq.exchange.vector=vector.exchange
rabbitmq.routingkey.chunking=chunking.key
rabbitmq.routingkey.embedding=embedding.key

# Local Ollama & Embedding Model Configuration
ollama.base-url=http://localhost:11434
ollama.embedding-model=nomic-embed-text
ollama.generation-model=llama3:8b
ollama.vector-dimension=768

# File Vault Document Ingestion Storage
file.vault.storage-path=./file_vault
file.vault.chunk-size=500
file.vault.chunk-overlap=80

# Multipart File Upload Limits
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
